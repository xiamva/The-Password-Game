<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Password Game Rules</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Password Game 🧩</h1>
  <input type="text" id="password" placeholder="Enter your password..." />
  <div id="alerts"></div>
  <button id="nextLevelBtn" style="display: none; margin-top: 20px; padding: 12px 24px; font-size: 16px; background-color: #4CAF50; color: white; border: none; border-radius: 8px; cursor: pointer;">🎉 Congratulations! Go to Level 2 →</button>


  <!-- Tooltip Data -->
  <template id="tooltip-5">
    <ul>
      <li>January</li>
      <li>February</li>
      <li>March</li>
      <li>April</li>
      <li>May</li>
      <li>June</li>
      <li>July</li>
      <li>August</li>
      <li>September</li>
      <li>October</li>
      <li>November</li>
      <li>December</li>
    </ul>
  </template>

  <template id="tooltip-7">
    <ul>
      <li>Cat</li>
      <li>Dog</li>
      <li>Lion</li>
      <li>Tiger</li>
      <li>Bear</li>
      <li>Monkey</li>
      <li>Elephant</li>
      <li>Giraffe</li>
      <li>Rabbit</li>
      <li>Fox</li>
    </ul>
  </template>

  <template id="tooltip-8">
    <ul>
      <li>Red</li>
      <li>Blue</li>
      <li>Green</li>
      <li>Yellow</li>
      <li>Black</li>
      <li>White</li>
      <li>Orange</li>
      <li>Purple</li>
      <li>Brown</li>
      <li>Pink</li>
    </ul>
  </template>

  <script>
    const passwordInput = document.getElementById("password");
    const alertsContainer = document.getElementById("alerts");

    const rules = [
      {
        message: "1. Password must be at least 8 characters long.",
        check: pw => pw.length >= 8
      },
      {
        message: "2. Must contain at least one number.",
        check: pw => /\d/.test(pw)
      },
      {
        message: "3. Must contain at least one uppercase letter.",
        check: pw => /[A-Z]/.test(pw)
      },
      {
        message: "4. Must contain at least one symbol.",
        check: pw => /[!@#$%^&*]/.test(pw)
      },
      {
        message: "5. Must include a month name.",
        check: pw => {
          const months = [
            "january","february","march","april","may","june","july","august","september","october","november","december"
          ];
          return months.some(month => pw.toLowerCase().includes(month));
        }
      },
      {
        message: "6. Must include a year between 1900 and 2099.",
        check: pw => /\b(19\d{2}|20\d{2})\b/.test(pw)
      },
      {
        message: "7. Must include an animal name.",
        check: pw => {
          const animals = [
            "cat","dog","lion","tiger","bear","monkey","elephant","giraffe","rabbit","fox"
          ];
          return animals.some(animal => pw.toLowerCase().includes(animal));
        }
      },
      {
        message: "8. Must include a color name.",
        check: pw => {
          const colors = [
            "red","blue","green","yellow","black","white","orange","purple","brown","pink"
          ];
          return colors.some(color => pw.toLowerCase().includes(color));
        }
      }
    ];

    passwordInput.addEventListener("input", () => {
      const pw = passwordInput.value;
      alertsContainer.innerHTML = "";
      let allPreviousPassed = true;

      for (let i = 0; i < rules.length; i++) {
        if (!allPreviousPassed) break;

        const rule = rules[i];
        const passed = rule.check(pw);
        const alert = document.createElement("div");
        alert.className = "alert " + (passed ? "passed" : "");
        alert.textContent = rule.message;

        // Tooltip for certain rules
        if ([4, 6, 7].includes(i)) {
          const tooltipId = `tooltip-${i + 1}`;
          const tooltipTemplate = document.getElementById(tooltipId);
          if (tooltipTemplate) {
            const tooltip = document.createElement("span");
            tooltip.className = "tooltip";
            tooltip.innerHTML = "ℹ️";
            const content = document.createElement("div");
            content.className = "tooltip-content";
            content.innerHTML = tooltipTemplate.innerHTML;
            tooltip.appendChild(content);
            alert.appendChild(tooltip);
          }
        }

        alertsContainer.appendChild(alert);
        if (!passed) allPreviousPassed = false;
      }
    });
    const nextLevelBtn = document.getElementById("nextLevelBtn");

passwordInput.addEventListener("input", () => {
  const pw = passwordInput.value;
  alertsContainer.innerHTML = "";
  let allPreviousPassed = true;

  for (let i = 0; i < rules.length; i++) {
    if (!allPreviousPassed) break;

    const rule = rules[i];
    const passed = rule.check(pw);
    const alert = document.createElement("div");
    alert.className = "alert " + (passed ? "passed" : "");
    alert.textContent = rule.message;

    if ([4, 6, 7].includes(i)) {
      const tooltipId = `tooltip-${i + 1}`;
      const tooltipTemplate = document.getElementById(tooltipId);
      if (tooltipTemplate) {
        const tooltip = document.createElement("span");
        tooltip.className = "tooltip";
        tooltip.innerHTML = "ℹ️";
        const content = document.createElement("div");
        content.className = "tooltip-content";
        content.innerHTML = tooltipTemplate.innerHTML;
        tooltip.appendChild(content);
        alert.appendChild(tooltip);
      }
    }

    alertsContainer.appendChild(alert);
    if (!passed) allPreviousPassed = false;
  }

  // Show Next Level button if all rules passed
  if (allPreviousPassed) {
    nextLevelBtn.style.display = "inline-block";
  } else {
    nextLevelBtn.style.display = "none";
  }
});

// When user clicks the Next Level button
nextLevelBtn.addEventListener("click", () => {
  window.location.href = "level2.html"; // Change this to your actual Level 2 file/page
});

  </script>
</body>
</html>
